name: AI Command Generator

# WHEN IT RUNS:
#   Automatically → when you publish a GitHub Release (github.com → Releases → Publish)
#   Manually      → Actions tab → "AI Command Generator" → Run workflow
#   Also          → when README or example docs change on master

on:
  release:
    types: [published]
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'examples/**/*.md'
      - 'tools/**/*.md'
      - 'scripts/generate_commands.py'
  workflow_dispatch:     # "Run workflow" button in the Actions tab

permissions:
  contents: write        # create branch + commit commands.json
  pull-requests: write   # open the review PR

jobs:
  generate-commands:
    runs-on: ubuntu-latest   # GitHub-hosted free VM, boots in ~10s

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/setup-python removed — ubuntu-latest ships Python 3.12 pre-installed
      # (setup-python@v5 used Node 20 which is deprecated on GitHub runners)

      - name: Install Python dependencies
        run: pip3 install openai requests beautifulsoup4

      - name: Run AI command generator
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
          TRUSTEDGE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: python3 scripts/generate_commands.py

      # ── Create a review PR so a human checks the diff before it goes live ──

      - name: Create review branch
        run: |
          BRANCH="ai-commands-${{ github.event.release.tag_name || github.sha }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/data/commands.json
          if git diff --staged --quiet; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            git commit -m "chore(ai): regenerate commands.json for ${{ github.event.release.tag_name || github.sha }}"
            git push origin "$BRANCH"
            echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          fi

      - name: Open Pull Request for review
        # Uses built-in gh CLI — no third-party action, no Node 20 dependency
        if: env.NO_CHANGES != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "🤖 AI-updated commands.json for ${VERSION_TAG}" \
            --label "ai-generated" \
            --body "## AI-generated commands — review before merging

          \`docs/data/commands.json\` was regenerated from dev.digicert.com docs using GitHub Models API (\`${MODEL}\`).

          ### How to review
          1. Click **Files changed** — verify every command against the [TrustEdge docs](https://dev.digicert.com/en/trustedge.html)
          2. Edit \`docs/data/commands.json\` directly in this PR if anything looks wrong
          3. Merge when satisfied → compatibility page goes live immediately

          ### Hallucination warnings
          Check the [Action run log](${RUN_URL}) for any ⚠ warnings flagged by the guard.

          ---
          _Wrong command? Fix the source docs so the AI gets it right next time._"
