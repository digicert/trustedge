name: AI Command Generator

# WHEN IT RUNS:
#   Automatically → when you publish a GitHub Release (github.com → Releases → Publish)
#   Manually      → Actions tab → "AI Command Generator" → Run workflow
#   Also          → when README or example docs change on master

on:
  release:
    types: [published]
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'examples/**/*.md'
      - 'tools/**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        # actions/checkout v4.2.2 — pinned to immutable commit SHA
        # To update: gh release view --repo actions/checkout --json tagName,targetCommitish
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        # actions/setup-python v5.3.0 — pinned to immutable commit SHA
        # To update: gh release view --repo actions/setup-python --json tagName,targetCommitish
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai requests beautifulsoup4

      - name: Run AI command generator
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
          TRUSTEDGE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/generate_commands.py

      # ── Open a PR using the built-in gh CLI (no third-party action needed) ──

      - name: Create review branch and open PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.event.release.tag_name || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
        run: |
          BRANCH="ai-commands-${VERSION_TAG:0:20}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/data/commands.json

          if git diff --staged --quiet; then
            echo "No changes to commands.json — skipping PR"
            exit 0
          fi

          git commit -m "chore(ai): regenerate commands.json for ${VERSION_TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "🤖 AI-updated commands.json for ${VERSION_TAG}" \
            --label "ai-generated" \
            --body "## AI-generated commands — review before merging

This PR was opened automatically by the **AI Command Generator** Action.

### What to review
1. Click the **Files changed** tab
2. Verify every command exists on the [TrustEdge docs](https://dev.digicert.com/en/trustedge.html)
3. Edit \`docs/data/commands.json\` directly in this PR if anything is wrong
4. Merge when satisfied — the compatibility page goes live immediately

### Sources consulted
The script fetched live pages from \`dev.digicert.com\` and extracted real command blocks.
Check the [Action run log](${RUN_URL}) to see which pages were consulted and any ⚠ hallucination warnings.

### Model used
\`${MODEL}\`

---
_Wrong command? Fix the source docs so the AI gets it right next time, or edit the JSON in this PR._"
