name: AI Command Generator

# WHEN IT RUNS:
#   Automatically → when you publish a GitHub Release (github.com → Releases → Publish)
#   Manually      → Actions tab → "AI Command Generator" → Run workflow
#   Also          → when README or example docs change on master

on:
  release:
    types: [published]
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'examples/**/*.md'
      - 'tools/**/*.md'
  workflow_dispatch:     # "Run workflow" button in the Actions tab

permissions:
  contents: write        # create branch + commit commands.json
  pull-requests: write   # open the review PR

jobs:
  generate-commands:
    runs-on: ubuntu-latest   # GitHub-hosted free VM, boots in ~10s

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai requests beautifulsoup4

      - name: Run AI command generator
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-injected, no setup needed
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
          TRUSTEDGE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/generate_commands.py

      # ── Create a review PR so a human checks the diff before it goes live ──

      - name: Create review branch
        run: |
          BRANCH="ai-commands-${{ github.event.release.tag_name || github.sha }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/data/commands.json
          if git diff --staged --quiet; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            git commit -m "chore(ai): regenerate commands.json for ${{ github.event.release.tag_name || github.sha }}"
            git push origin "$BRANCH"
            echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          fi

      - name: Open Pull Request for review
        if: env.NO_CHANGES != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          base: master
          title: "🤖 AI-updated commands.json for ${{ github.event.release.tag_name || github.ref_name }}"
          body: |
            ## AI-generated commands review

            This PR was opened automatically by the **AI Command Generator** Action.

            ### What changed
            `docs/data/commands.json` was regenerated from the current README and example docs
            using GitHub Models API (`${{ vars.AI_MODEL || 'openai/gpt-4o' }}`).

            ### How to review
            1. Click the **Files changed** tab above
            2. Read every command diff — verify flags and paths match the real docs
            3. If anything looks wrong, edit `docs/data/commands.json` directly in this PR
            4. When satisfied → **Merge pull request** → the compatibility page goes live

            ### Hallucination warnings
            Check the [Action run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            for any ⚠ hallucination warnings flagged by the guard.

            ---
            _To fix a wrong command: edit the file in this PR, or close the PR and fix
            the source documentation so the AI generates it correctly next time._
          labels: ai-generated, commands
          draft: false
